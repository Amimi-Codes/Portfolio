<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="19" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grain"/>
      <feComponentTransfer in="grain" result="soft">
        <feFuncR type="linear" slope=".13" intercept=".47"/>
        <feFuncG type="linear" slope=".13" intercept=".43"/>
        <feFuncB type="linear" slope=".13" intercept=".34"/>
        <feFuncA type="linear" slope=".22"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
    </filter>
    <radialGradient id="warm" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".72" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#f2e3ca"/>
    </radialGradient>
  </defs>
  <rect width="360" height="360" fill="url(#warm)" filter="url(#paper)"/>
  <g fill="#b99d73" opacity=".075">
    <circle cx="43" cy="68" r="1.5"/><circle cx="129" cy="214" r="1.1"/><circle cx="241" cy="92" r="1.4"/>
    <circle cx="315" cy="278" r="1.2"/><circle cx="183" cy="322" r="1.6"/><circle cx="78" cy="286" r=".9"/>
  </g>
</svg>